[package]
name = "tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sfio-rustls-config = { path = "../lib", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
tokio = { version = "1.44", features = ["test-util", "net", "rt", "macros"] }

# exactly one provider, as for the library
[features]
default = ["crypto-aws-lc"]
crypto-aws-lc = ["sfio-rustls-config/crypto-aws-lc", "tokio-rustls/aws-lc-rs"]
crypto-ring = ["sfio-rustls-config/crypto-ring", "tokio-rustls/ring"]

[[test]]
name = "test_verifiers"
path = "src/test_verifiers.rs"


