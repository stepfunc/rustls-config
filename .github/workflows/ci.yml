name: CI
on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs this on the tagged commit before publishing
  workflow_call:
permissions:
  contents: read
jobs:
  # Format, lint and test the library with each crypto provider
  check:
    strategy:
      fail-fast: false
      matrix:
        provider: [crypto-ring, crypto-aws-lc]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p sfio-rustls-config --all-targets --features ${{ matrix.provider }} -- -D warnings
      - name: Test
        run: cargo test -p sfio-rustls-config --features ${{ matrix.provider }}
  # The verifier tests in the tests crate, with each crypto provider
  integration:
    strategy:
      fail-fast: false
      matrix:
        provider: [crypto-ring, crypto-aws-lc]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy -p tests --all-targets --no-default-features --features ${{ matrix.provider }} -- -D warnings
      - name: Test
        run: cargo test -p tests --no-default-features --features ${{ matrix.provider }}
  # Build with the rust-version declared in lib/Cargo.toml
  msrv:
    strategy:
      fail-fast: false
      matrix:
        provider: [crypto-ring, crypto-aws-lc]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85
      # there's no lockfile, so pick the newest dependency versions that support the rust-version
      - name: Check
        run: cargo check -p sfio-rustls-config --features ${{ matrix.provider }}
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
  # Fail on any advisory against the dependencies
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo generate-lockfile && cargo audit
